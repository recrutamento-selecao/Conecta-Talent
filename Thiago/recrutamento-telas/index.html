<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telas - Sistema de Recrutamento</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      background: #f4f7ff;
      color: #0b225c;
    }

    main {
      width: min(720px, calc(100% - 40px));
      background: #fff;
      border: 1px solid #d7dff1;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 12px 32px rgba(18, 61, 178, .12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    p {
      margin: 0 0 22px;
      color: #59677f;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 46px;
      padding: 0 16px;
      border: 1px solid #1c4bd6;
      border-radius: 8px;
      color: #103fbe;
      text-decoration: none;
      font-weight: 400;
      background: #fff;
    }

    a:hover {
      background: #eef3ff;
    }

    body,
    body *,
    button,
    input,
    textarea,
    select,
    ::placeholder {
      font-family: Arial, Helvetica, sans-serif !important;
      font-weight: 400 !important;
      color: #000 !important;
    }

    main {
      box-shadow: 0 16px 36px rgba(20, 42, 90, .12);
    }

    a {
      border-color: #1d4ed8;
      color: #111 !important;
    }

    body,
    body *,
    a {
      font-family: "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, Arial, Helvetica, sans-serif !important;
      letter-spacing: 0 !important;
      line-height: 1.32 !important;
    }

    h1 {
      font-weight: 650 !important;
      color: #0b0f19 !important;
    }

    p {
      color: #4b5563 !important;
    }

    a {
      font-weight: 500 !important;
    }
  </style>
</head>
<body>
  <main>
    <h1>Telas do sistema de recrutamento</h1>
    <p>Cada tela abaixo está separada em sua própria pasta com HTML, CSS e JS.</p>
    <nav>
      <a href="./criar-vaga/index.html">Criar Nova Vaga <span>abrir</span></a>
      <a href="./alterar-senha/index.html">Alterar Senha <span>abrir</span></a>
      <a href="./cadastrar-recrutador/index.html">Cadastrar Recrutador <span>abrir</span></a>
      <a href="./meu-perfil/index.html">Meu Perfil <span>abrir</span></a>
      <a href="./configuracao-vaga/index.html">Configuracao da Vaga <span>abrir</span></a>
    </nav>
  </main>
</body>
</html>
